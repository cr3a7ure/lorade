[project]
name = "tools"
version = "0.1.0"
description = "Knowledge ingestion pipeline for Claude/Open Code via gitingest + FAISS MCP"
requires-python = ">=3.12"
dependencies = [
    "gitingest>=0.3.1",
    "local-faiss-mcp>=0.2.1",
]

[project.scripts]
pipeline = "tools.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]

[tool.uv]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
